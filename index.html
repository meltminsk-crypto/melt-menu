<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MELT — меню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#171310;
    --surface:#211b15;
    --surface-2:#2a231b;
    --line:#3c3327;
    --cream:#f3ead9;
    --dim:#ab9d84;
    --dim-2:#7d715c;
    --rust:#cd7439;
    --sage:#96ab7e;
    --wine:#a55c50;
    --gold:#cfa227;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--cream);}
  body{
    font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  .app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative;}

  .hero{
    padding:28px 20px 18px;
    background:
      radial-gradient(120% 100% at 15% 0%, rgba(205,116,57,0.16), transparent 55%),
      var(--bg);
    border-bottom:1px solid var(--line);
  }
  .hero-top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px;}
  .wordmark{
    font-family:'Newsreader', serif;
    font-style:italic;
    font-weight:600;
    font-size:34px;
    letter-spacing:0.5px;
    color:var(--cream);
  }
  .locale{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--dim-2);
    text-transform:uppercase;
    letter-spacing:0.08em;
    text-align:right;
    line-height:1.5;
  }
  .tagline{
    font-size:12.5px;
    color:var(--dim);
    letter-spacing:0.02em;
    margin-bottom:20px;
  }

  .clock{margin-top:6px;}
  .clock-status{
    display:flex; align-items:center; gap:8px;
    margin-bottom:10px;
  }
  .clock-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--sage);
    box-shadow:0 0 0 3px rgba(150,171,126,0.18);
    flex-shrink:0;
  }
  .clock-dot.closed{background:var(--dim-2); box-shadow:0 0 0 3px rgba(125,113,92,0.18);}
  .clock-text{font-size:13px; color:var(--cream); font-weight:600;}
  .clock-text span{color:var(--dim); font-weight:500;}

  .timeline{
    position:relative;
    height:26px;
  }
  .timeline-track{
    position:relative;
    height:6px;
    border-radius:4px;
    background:var(--surface-2);
    overflow:hidden;
    display:flex;
  }
  .seg{height:100%;}
  .seg.breakfast{background:linear-gradient(90deg, var(--sage), var(--sage)); flex:6;}
  .seg.evening{background:linear-gradient(90deg, var(--wine), var(--wine)); flex:6;}
  .timeline-labels{
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    color:var(--dim-2);
    margin-top:6px;
    letter-spacing:0.03em;
  }
  .now-marker{
    position:absolute; top:-3px;
    width:12px; height:12px; border-radius:50%;
    background:var(--cream);
    border:2px solid var(--bg);
    box-shadow:0 0 0 1px var(--line);
    transform:translateX(-50%);
    transition:left 0.3s ease;
  }

  .tabs{
    display:flex;
    gap:8px;
    padding:14px 20px 10px;
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 6px 9px;
    border-radius:12px;
    background:var(--surface);
    border:1px solid var(--line);
    cursor:pointer;
    transition:background 0.15s, border-color 0.15s;
    user-select:none;
  }
  .tab .tab-name{
    display:block;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.01em;
  }
  .tab .tab-hours{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    color:var(--dim-2);
    margin-top:2px;
  }
  .tab.active{background:var(--surface-2); border-color:var(--dim-2);}
  .tab[data-tab="breakfast"].active{border-color:var(--sage);}
  .tab[data-tab="allday"].active{border-color:var(--gold);}
  .tab[data-tab="evening"].active{border-color:var(--wine);}
  .tab.active .tab-name{color:var(--cream);}
  .tab:not(.active) .tab-name{color:var(--dim);}

  .subtabs{
    display:flex; gap:8px;
    padding:12px 20px 4px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .subtabs::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-size:11.5px;
    font-weight:600;
    color:var(--dim);
    padding:6px 13px;
    border-radius:20px;
    border:1px solid var(--line);
    white-space:nowrap;
    cursor:pointer;
  }
  .chip:active{background:var(--surface-2);}

  .menu-view{padding:6px 20px 10px;}
  .menu-view.hidden{display:none;}

  .cat-block{margin-top:26px;}
  .cat-title{
    font-family:'Newsreader', serif;
    font-style:italic;
    font-weight:600;
    font-size:19px;
    color:var(--cream);
    margin-bottom:2px;
  }
  .cat-rule{
    height:1px;
    background:linear-gradient(90deg, var(--line), transparent);
    margin:8px 0 14px;
  }

  .item{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .item:last-child{border-bottom:none;}
  .item-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }
  .item-name{
    font-size:14.5px;
    font-weight:700;
    color:var(--cream);
    letter-spacing:0.01em;
  }
  .item-price{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    font-weight:500;
    color:var(--rust);
    white-space:nowrap;
  }
  .item-price::after{content:' р.'; font-size:10px; color:var(--rust); opacity:0.7;}
  .item-desc{
    font-size:12.5px;
    color:var(--dim);
    line-height:1.5;
    margin-top:5px;
  }
  .item-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--dim-2);
    margin-top:6px;
    letter-spacing:0.02em;
  }

  .item-prices{display:flex; gap:14px; margin-top:2px;}
  .price-opt{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--rust);
  }
  .price-opt b{font-weight:600;}
  .price-opt span{color:var(--dim-2); font-size:10px;}

  .constructor{
    margin-top:24px;
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 16px 6px;
    background:var(--surface);
  }
  .constructor-title{
    font-family:'Newsreader', serif;
    font-style:italic;
    font-weight:600;
    font-size:16px;
    margin-bottom:12px;
  }
  .cons-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:8px 0;
    border-bottom:1px dashed var(--line);
    font-size:12.5px;
  }
  .cons-row:last-child{border-bottom:none;}
  .cons-name{color:var(--cream); font-weight:500;}
  .cons-weight{color:var(--dim-2); font-size:10px; margin-left:4px;}
  .cons-price{
    font-family:'IBM Plex Mono', monospace;
    color:var(--sage);
    font-size:12px;
    white-space:nowrap;
  }
  .cons-base{color:var(--dim-2); font-style:italic;}

  footer{
    text-align:center;
    padding:30px 20px 10px;
    font-size:10.5px;
    color:var(--dim-2);
    letter-spacing:0.03em;
  }
</style>
</head>
<body>
<div class="app">

  <div class="hero">
    <div class="hero-top">

</div>

const menuRoot = document.getElementById('menuRoot');
const subtabsEl = document.getElementById('subtabs');
const tabsEl = document.getElementById('tabs');

function renderItem(item){
  if(item.dualPrice){
    return `
      <div class="item">
        <div class="item-name">${item.name}</div>
        ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
        <div class="item-prices">
          ${item.dualPrice.map(p => `
            <div class="price-opt">${p.label} — <b>${p.price} р.</b><br><span>${p.meta}</span></div>
          `).join('')}
        </div>
      </div>`;
  }
  return `
    <div class="item">
      <div class="item-head">
        <div class="item-name">${item.name}</div>
        <div class="item-price">${item.price}</div>
      </div>
      ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
      ${item.meta ? `<div class="item-meta">${item.meta}</div>` : ''}
    </div>`;
}

function renderConstructor(c){
  return `
    <div class="constructor">
      <div class="constructor-title">${c.title}</div>
      <div class="cons-row"><span class="cons-base">${c.base}</span></div>
      ${c.addons.map(a => `
        <div class="cons-row">
          <span class="cons-name">${a.name}<span class="cons-weight">${a.weight}</span></span>
          <span class="cons-price">${a.price} р.</span>
        </div>
      `).join('')}
    </div>`;
}

function renderTab(tabId){
  const data = MENU[tabId];
  let html = `<div class="menu-view" id="view-${tabId}">`;
  data.categories.forEach(cat => {
    html += `
      <div class="cat-block" id="cat-${tabId}-${cat.id}">
        <div class="cat-title">${cat.title}</div>
        <div class="cat-rule"></div>
        ${cat.items.map(renderItem).join('')}
      </div>`;
  });
  if(data.constructor){
    html += renderConstructor(data.constructor);
  }
  html += `</div>`;
  return html;
}

['breakfast','allday','evening'].forEach(tabId => {
  menuRoot.insertAdjacentHTML('beforeend', renderTab(tabId));
});

function renderSubtabs(tabId){
  const data = MENU[tabId];
  subtabsEl.innerHTML = data.categories.map(cat =>
    `<div class="chip" data-target="cat-${tabId}-${cat.id}">${cat.title}</div>`
  ).join('') + (data.constructor ? `<div class="chip" data-target="constructor-${tabId}">Конструктор</div>` : '');
}

function setActiveTab(tabId){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabId));
  document.querySelectorAll('.menu-view').forEach(v => v.classList.toggle('hidden', v.id !== `view-${tabId}`));
  renderSubtabs(tabId);
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}

tabsEl.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if(!tab) return;
  setActiveTab(tab.dataset.tab);
});

subtabsEl.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  const target = document.getElementById(chip.dataset.target);
  if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
});

function updateClock(){
  const now = new Date();
  const hourFloat = now.getHours() + now.getMinutes()/60;

  const track = document.querySelector('.timeline-track');
  const trackWidth = track.offsetWidth;
  const pct = Math.min(Math.max((hourFloat - 10) / (22 - 10), 0), 1);
  document.getElementById('nowMarker').style.left = (pct * trackWidth) + 'px';

  const dot = document.getElementById('clockDot');
  const text = document.getElementById('clockText');

  let statusHTML, defaultTab, closed = false;
  if(hourFloat < 10){
    statusHTML = `Закрыто <span>· откроемся в 10:00</span>`;
    defaultTab = 'breakfast';
    closed = true;
  } else if(hourFloat < 16){
    statusHTML = `Открыто <span>· завтрак и основное меню</span>`;
    defaultTab = 'breakfast';
  } else if(hourFloat < 22){
    statusHTML = `Открыто <span>· вечернее и основное меню</span>`;
    defaultTab = 'evening';
  } else {
    statusHTML = `Закрыто <span>· откроемся в 10:00</span>`;
    defaultTab = 'breakfast';
    closed = true;
  }
  text.innerHTML = statusHTML;
  dot.classList.toggle('closed', closed);
  return defaultTab;
}

const initialTab = updateClock();
setActiveTab(initialTab);
setInterval(updateClock, 60000);
window.addEventListener('resize', updateClock);
</script>
