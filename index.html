<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор зарплат · Melt</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#1f1d1a;--mu:#7a746b;--ln:#e8e3db;--ac:#c4571f;--soft:#fbeee6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--tx:#f1ece4;--mu:#9d968b;--ln:#363029;--ac:#e8814d;--soft:#2e2219;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--tx:#f1ece4;--mu:#9d968b;--ln:#363029;--ac:#e8814d;--soft:#2e2219;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.w{max-width:760px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mu);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:6px 8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);text-align:right;padding:8px 6px}
th:first-child,td:first-child{text-align:left}
td{padding:5px 6px;border-top:1px solid var(--ln);text-align:right;white-space:nowrap}
tr:first-child td{border-top:0}
input{font:inherit;color:var(--tx);background:transparent;border:1px solid transparent;border-radius:8px;padding:6px;width:100%}
input:focus{outline:none;border-color:var(--ac);background:var(--soft)}
.n{min-width:90px}.v{width:64px;text-align:right}.h{width:72px;text-align:right;background:var(--soft)}
.o{font-weight:600}.o2{color:var(--ac);font-weight:600}
.x{border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer;padding:2px 6px}
tfoot td{border-top:2px solid var(--ln);font-weight:700;padding-top:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button.b{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
.sum{margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px}
.sum span:nth-child(even){text-align:right}.sum .t{font-weight:700;color:var(--ac)}
.bg{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:13px;margin-top:10px}.bg input{width:64px;border-color:var(--ln);text-align:right}
</style></head><body><div class="w">
<h1>Калькулятор зарплат</h1>
<p class="sub">Сотрудник получает на карту ровно «На руки». «Без ФСЗН 34%» — на руки + подоходный 13% + ФСЗН 1%. «С ФСЗН 34%» — плюс взнос нанимателя 34% (и Белгосстрах, если указан).</p>
<div class="card"><table>
<thead><tr><th>Имя</th><th>Ставка/ч</th><th>Часы</th><th>На руки</th><th>Без ФСЗН 34%</th><th>С ФСЗН 34%</th><th></th></tr></thead>
<tbody id="tb"></tbody>
<tfoot><tr><td>Итого</td><td></td><td id="th"></td><td id="tn"></td><td id="tg"></td><td id="tt"></td><td></td></tr></tfoot>
</table></div>
<div class="bar"><button class="b" id="add">+ Сотрудник</button><button class="b" id="clr">Очистить часы</button><button class="b" id="pdf">Скачать PDF</button><span id="st" style="color:var(--mu);font-size:13px;align-self:center"></span></div>
<div class="bg">Белгосстрах, % <input id="bgs" inputmode="decimal"> <span>(по договору, по умолчанию 0)</span></div>
<div class="sum" id="sum"></div>
</div>
<script>
const K=0.86;
const DEF=[["Кирилл",14],["Паша",13],["Лера",10],["Вадим",10],["Элина",9],["Женя",9],["Ксюша",9]];
let S=null;
try{S=JSON.parse(localStorage.getItem("melt_pay1"))}catch(e){}
if(!S||!Array.isArray(S.r))S={r:DEF.map(([n,v])=>({n,v:String(v),h:""})),b:"0"};
const save=()=>{try{localStorage.setItem("melt_pay1",JSON.stringify(S))}catch(e){}};
const p=x=>parseFloat(String(x).replace(",","."))||0;
const f=x=>x.toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2});
const tb=document.getElementById("tb");
function render(){
  tb.innerHTML="";
  S.r.forEach((r,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML='<td><input class="n" placeholder="Имя"></td><td><input class="v" inputmode="decimal"></td><td><input class="h" inputmode="decimal" placeholder="0"></td><td class="o"></td><td class="o"></td><td class="o2"></td><td><button class="x" title="Удалить">×</button></td>';
    const [n,v,h]=tr.querySelectorAll("input");
    n.value=r.n;v.value=r.v;h.value=r.h;
    n.oninput=()=>{r.n=n.value;save()};
    v.oninput=()=>{r.v=v.value;calc()};
    h.oninput=()=>{r.h=h.value;calc()};
    tr.querySelector(".x").onclick=()=>{if(confirm("Удалить "+(r.n||"строку")+"?")){S.r.splice(i,1);render()}};
    tb.appendChild(tr);
  });
  calc();
}
function calc(){
  const b=p(S.b)/100;let H=0,N=0,G=0;
  [...tb.rows].forEach((tr,i)=>{
    const r=S.r[i],net=p(r.v)*p(r.h),g=net/K;
    H+=p(r.h);N+=net;G+=g;
    tr.cells[3].textContent=f(net);
    tr.cells[4].textContent=f(g);tr.cells[5].textContent=f(g*(1+0.34+b));
  });
  const e1=G*0.01,tax=G*0.13,e34=G*0.34,bg=G*b,tot=G+e34+bg;
  th.textContent=H.toLocaleString("ru-RU");tn.textContent=f(N);tg.textContent=f(G);tt.textContent=f(tot);
  sum.innerHTML=[["Сотрудникам на карту",N],["Подоходный 13%",tax],["ФСЗН 1%",e1],["ФСЗН 34%",e34],["Белгосстрах",bg]]
    .map(([a,x])=>`<span>${a}</span><span>${f(x)} р</span>`).join("")+`<span class="t">Всего расход</span><span class="t">${f(tot)} р</span>`;
  save();
}
add.onclick=()=>{S.r.push({n:"",v:"0",h:""});render();tb.lastChild.querySelector(".n").focus()};
clr.onclick=()=>{S.r.forEach(r=>r.h="");render()};
bgs.value=S.b;bgs.oninput=()=>{S.b=bgs.value;calc()};
function note(t){st.textContent=t;setTimeout(()=>{st.textContent=""},3500)}
function drawPage(){
  const b=p(S.b)/100,W=1240,HH=1754,M=80,F="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif";
  const rows=S.r.filter(r=>p(r.h)>0).map(r=>{const net=p(r.v)*p(r.h),g=net/K;return{n:r.n||"—",v:p(r.v),h:p(r.h),net,g,t:g*(1.34+b)}});
  if(!rows.length)return null;
  const cv=document.createElement("canvas");cv.width=W;cv.height=HH;
  const x=cv.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,HH);x.textBaseline="middle";
  x.textAlign="left";x.fillStyle="#111";x.font="700 44px "+F;x.fillText("Расчёт зарплат · Melt",M,100);
  x.fillStyle="#777";x.font="24px "+F;x.fillText("Сформировано "+new Date().toLocaleDateString("ru-RU"),M,150);
  const cols=[["Имя",220],["Ставка/ч",130],["Часы",110],["На руки",190],["Без ФСЗН 34%",210],["С ФСЗН 34%",220]];
  const rule=(yy,h,col)=>{x.fillStyle=col;x.fillRect(M,yy,W-2*M,h)};
  const row=(yy,vals,font,col)=>{x.font=font;x.fillStyle=col;let cx=M;cols.forEach((cl,i)=>{x.textAlign=i?"right":"left";x.fillText(vals[i],i?cx+cl[1]:cx,yy);cx+=cl[1]})};
  let y=230,H=0,N=0,G=0;
  row(y,cols.map(cl=>cl[0]),"700 22px "+F,"#777");rule(y+28,3,"#111");y+=66;
  rows.forEach(r=>{H+=r.h;N+=r.net;G+=r.g;
    row(y,[r.n,f(r.v),String(r.h).replace(".",","),f(r.net),f(r.g),f(r.t)],"26px "+F,"#111");rule(y+32,1,"#e5e5e5");y+=64});
  const e1=G*0.01,tax=G*0.13,e34=G*0.34,bg=G*b,tot=G+e34+bg;
  rule(y-32,3,"#111");
  row(y,["Итого","",H.toLocaleString("ru-RU"),f(N),f(G),f(tot)],"700 26px "+F,"#111");
  y+=110;
  [["Сотрудникам на карту",N],["Подоходный 13%",tax],["ФСЗН 1%",e1],["ФСЗН 34%",e34]].concat(b>0?[["Белгосстрах",bg]]:[]).forEach(([a,v])=>{
    x.font="26px "+F;x.fillStyle="#111";x.textAlign="left";x.fillText(a,M,y);x.textAlign="right";x.fillText(f(v)+" р",W-M,y);y+=52});
  rule(y-26,2,"#111");y+=22;
  x.font="700 32px "+F;x.fillStyle="#111";x.textAlign="left";x.fillText("Всего расход",M,y);x.textAlign="right";x.fillText(f(tot)+" р",W-M,y);
  return cv;
}
async function makePdf(cv){
  const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.92));
  const jpg=new Uint8Array(await blob.arrayBuffer());
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=d=>{const u=typeof d==="string"?enc.encode(d):d;parts.push(u);len+=u.length};
  const obj=(n,body,stream)=>{offs[n]=len;push(n+" 0 obj\n"+body+"\n");if(stream){push("stream\n");push(stream);push("\nendstream\n")}push("endobj\n")};
  push("%PDF-1.4\n");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
  obj(4,"<< /Type /XObject /Subtype /Image /Width "+cv.width+" /Height "+cv.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>",jpg);
  const cs="q 595 0 0 842 0 0 cm /Im0 Do Q";
  obj(5,"<< /Length "+cs.length+" >>",enc.encode(cs));
  const xr=len;push("xref\n0 6\n0000000000 65535 f \n");
  for(let i=1;i<=5;i++)push(String(offs[i]).padStart(10,"0")+" 00000 n \n");
  push("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
pdf.onclick=async()=>{
  const cv=drawPage();
  if(!cv)return note("Введите часы хотя бы одному сотруднику");
  try{const u=URL.createObjectURL(await makePdf(cv)),a=document.createElement("a");a.href=u;a.download="zarplaty-"+new Date().toISOString().slice(0,10)+".pdf";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  catch(e){note("Не удалось сохранить PDF")}
};
document.addEventListener("click",e=>{const a=document.activeElement;if(a&&a.tagName==="INPUT"&&!e.target.closest("input,button"))a.blur()});
render();
</script></body></html>
